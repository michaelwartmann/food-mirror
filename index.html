<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Essensspiegel</title>
<meta name="description" content="Was du isst, einfach gespiegelt. Frei, ohne Konto, alles bleibt auf deinem Handy.">
<meta name="theme-color" content="#FBFAF7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><img src="icons/icon.svg" alt="" width="34" height="34"><span>ESSENSSPIEGEL</span></div>
  <div class="lang" role="group" aria-label="Sprache / Language">
    <button data-lang="de" type="button">DE</button><button data-lang="en" type="button">EN</button>
  </div>
</header>
<main id="view" tabindex="-1"></main>
<nav class="tabs" aria-label="Navigation">
  <button data-tab="today" type="button"><span aria-hidden="true">☀️</span><b data-t="tToday"></b></button>
  <button data-tab="stock" type="button"><span aria-hidden="true">🧺</span><b data-t="tStock"></b></button>
  <button data-tab="mirror" type="button"><span aria-hidden="true">🪞</span><b data-t="tMirror"></b></button>
  <button data-tab="more" type="button"><span aria-hidden="true">⋯</span><b data-t="tMore"></b></button>
</nav>
<div id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-q">
  <div class="sheet-card">
    <button class="x" type="button" id="sheet-x" data-t-aria="close">✕</button>
    <div id="sheet-body"></div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="foods.js"></script>
<script src="personas.js"></script>
<script src="app.js"></script>
</body>
</html>
